name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Lunes 06:00 UTC — además del análisis en cada PR, una pasada completa semanal.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analizar:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # El job reporta su estado vía la API de Actions (GET workflow-runs); sin esto
      # falla con "Resource not accessible by integration" aun con upload: false.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # CodeQL todavía no reconoce "php" como lenguaje (CLI 2.27.3): solo TS/JS por ahora.
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # upload: false — code scanning (pestaña Security) exige GitHub Advanced Security, que en
      # repos privados es de pago. El análisis corre igual; el SARIF queda como artefacto del run
      # en vez de subirse, y el paso siguiente falla el job si encuentra algo.
      - name: Analizar
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: sarif-results

      - name: Publicar resultados SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 30

      - name: Fallar si CodeQL encontró algo
        run: |
          total=$(jq '[.runs[].results[]] | length' sarif-results/*.sarif | awk '{s+=$1} END {print s+0}')
          echo "Hallazgos de CodeQL: $total"
          if [ "$total" -gt 0 ]; then
            jq -r '.runs[].results[] | "- \(.ruleId): \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine))"' sarif-results/*.sarif
            exit 1
          fi
